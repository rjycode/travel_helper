slots:
  order_number:
    type: text
    label: 订单号
    description: 用户的订单号

  order_status:
    type: text
    label: 订单状态
    description: 订单当前状态

  order_summary:
    type: text
    label: 订单摘要
    description: 订单摘要信息

  tracking_number:
    type: text
    label: 物流单号
    description: 物流单号

  logistics_company:
    type: text
    label: 物流公司
    description: 物流公司名称

  logistics_status:
    type: text
    label: 物流进度
    description: 物流当前进度

  product_id:
    type: text
    label: 商品ID
    description: 当前咨询商品的唯一标识

  refund_reason:
    type: text
    label: 退款原因
    description: 申请退款的原因

  departure_city:
    type: text
    label: 出发城市
    description: 机票查询的出发城市名称，如 上海、北京

  arrival_city:
    type: text
    label: 到达城市
    description: 机票查询的到达城市名称，如 上海、北京

  departure_date:
    type: text
    label: 出发日期
    description: 机票查询的出发日期，格式 YYYY-MM-DD，如 2026-09-01

  hotel_city:
    type: text
    label: 酒店城市
    description: 酒店查询的城市名称，如 上海、北京

  check_in_date:
    type: text
    label: 入住日期
    description: 酒店入住日期，格式 YYYY-MM-DD，如 2026-09-01

  check_out_date:
    type: text
    label: 离店日期
    description: 酒店离店日期，格式 YYYY-MM-DD，必须晚于入住日期

  flight_results:
    type: text
    label: 航班查询结果
    description: 机票搜索结果文本

  hotel_results:
    type: text
    label: 酒店查询结果
    description: 酒店搜索结果文本

  scenic_city:
    type: text
    label: 景点城市
    description: 景点查询的城市名称，如 上海、三亚

  scenic_date:
    type: text
    label: 游玩日期
    description: 景点游玩日期，格式 YYYY-MM-DD，如 2026-09-01

  scenic_results:
    type: text
    label: 景点查询结果
    description: 景点搜索结果文本

  train_from:
    type: text
    label: 火车出发城市
    description: 火车票查询的出发城市名称

  train_to:
    type: text
    label: 火车到达城市
    description: 火车票查询的到达城市名称

  train_date:
    type: text
    label: 火车出发日期
    description: 火车票查询的出发日期，格式 YYYY-MM-DD

  train_results:
    type: text
    label: 火车查询结果
    description: 火车票搜索结果文本

  bus_from:
    type: text
    label: 汽车出发城市
    description: 汽车票查询的出发城市名称

  bus_to:
    type: text
    label: 汽车到达城市
    description: 汽车票查询的到达城市名称

  bus_date:
    type: text
    label: 汽车出发日期
    description: 汽车票查询的出发日期，格式 YYYY-MM-DD

  bus_results:
    type: text
    label: 汽车查询结果
    description: 汽车票搜索结果文本

  transfer_city:
    type: text
    label: 接送服务城市
    description: 接送服务查询的城市名称

  transfer_date:
    type: text
    label: 接送服务日期
    description: 接送服务日期，格式 YYYY-MM-DD

  transfer_results:
    type: text
    label: 接送服务查询结果
    description: 接送服务搜索结果文本

  travel_order_no:
    type: text
    label: 旅游订单号
    description: 旅游平台订单号，如 ORD0000000001

  order_results:
    type: text
    label: 订单查询结果
    description: 旅游订单查询结果文本

flows:
  onboarding:
    name: 欢迎引导
    description: 在聊天窗口初次打开时欢迎用户，并介绍助手可处理的电商服务。这个 flow 通常由系统主动触发。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "你好，这里是 Atguigu 旅游出行助手。我可以帮你查机票、火车票、汽车票、酒店、景点和接送服务，也可以帮你查询旅游订单。比如告诉我\"帮我查上海到北京的机票\"、\"查一下上海的酒店\"或\"查一下我的订单\"。"
        next: end

      - id: end
        type: end
        next: [ ]

  flight_search:
    name: 机票查询
    description: 帮用户查询机票，需要收集出发城市、到达城市和出发日期，然后展示航班和价格信息。当用户询问"查机票""航班""怎么去某地"时使用。
    steps:
      - id: start
        type: start
        next: ask_departure_city

      - id: ask_departure_city
        type: collect
        slot_name: departure_city
        response:
          text: "请问从哪个城市出发？"
        next: ask_arrival_city

      - id: ask_arrival_city
        type: collect
        slot_name: arrival_city
        response:
          text: "请问到达哪个城市？"
        next: ask_departure_date

      - id: ask_departure_date
        type: collect
        slot_name: departure_date
        response:
          text: "请问几号出发？（格式 YYYY-MM-DD，例如 2026-09-01）"
        next: search_flights

      - id: search_flights
        type: action
        action: action_search_flights
        next: show_flights

      - id: show_flights
        type: action
        action: action_response
        args:
          text: "{{ slots.flight_results }}"
        next: end

      - id: end
        type: end
        next: [ ]

  hotel_search:
    name: 酒店查询
    description: 帮用户查询酒店，需要收集城市、入住日期和离店日期，然后展示酒店和价格信息。当用户询问"查酒店""订房""住宿"时使用。
    steps:
      - id: start
        type: start
        next: ask_hotel_city

      - id: ask_hotel_city
        type: collect
        slot_name: hotel_city
        response:
          text: "请问想住在哪个城市？"
        next: ask_check_in_date

      - id: ask_check_in_date
        type: collect
        slot_name: check_in_date
        response:
          text: "请问入住日期是哪天？（格式 YYYY-MM-DD，例如 2026-09-01）"
        next: ask_check_out_date

      - id: ask_check_out_date
        type: collect
        slot_name: check_out_date
        response:
          text: "请问哪天退房？（格式 YYYY-MM-DD，需晚于入住日期）"
        next: search_hotels

      - id: search_hotels
        type: action
        action: action_search_hotels
        next: show_hotels

      - id: show_hotels
        type: action
        action: action_response
        args:
          text: "{{ slots.hotel_results }}"
        next: end

      - id: end
        type: end
        next: [ ]

  scenic_search:
    name: 景点查询
    description: 帮用户查询景点，需要收集城市和游玩日期，然后展示景点和门票价格。当用户询问"查景点""景区门票""去哪里玩"时使用。
    steps:
      - id: start
        type: start
        next: ask_scenic_city

      - id: ask_scenic_city
        type: collect
        slot_name: scenic_city
        response:
          text: "请问想去哪个城市游玩？"
        next: ask_scenic_date

      - id: ask_scenic_date
        type: collect
        slot_name: scenic_date
        response:
          text: "请问哪天去？（格式 YYYY-MM-DD，例如 2026-09-01）"
        next: search_scenic

      - id: search_scenic
        type: action
        action: action_search_scenic_spots
        next: show_scenic

      - id: show_scenic
        type: action
        action: action_response
        args:
          text: "{{ slots.scenic_results }}"
        next: end

      - id: end
        type: end
        next: [ ]

  train_search:
    name: 火车票查询
    description: 帮用户查询火车票，需要收集出发城市、到达城市和出发日期，然后展示车次和价格。当用户询问"查火车票""高铁""动车"时使用。
    steps:
      - id: start
        type: start
        next: ask_train_from

      - id: ask_train_from
        type: collect
        slot_name: train_from
        response:
          text: "请问从哪个城市出发？"
        next: ask_train_to

      - id: ask_train_to
        type: collect
        slot_name: train_to
        response:
          text: "请问到达哪个城市？"
        next: ask_train_date

      - id: ask_train_date
        type: collect
        slot_name: train_date
        response:
          text: "请问几号出发？（格式 YYYY-MM-DD，例如 2026-09-01）"
        next: search_trains

      - id: search_trains
        type: action
        action: action_search_trains
        next: show_trains

      - id: show_trains
        type: action
        action: action_response
        args:
          text: "{{ slots.train_results }}"
        next: end

      - id: end
        type: end
        next: [ ]

  bus_search:
    name: 汽车票查询
    description: 帮用户查询汽车票，需要收集出发城市、到达城市和出发日期，然后展示班次和票价。当用户询问"查汽车票""大巴""班车"时使用。
    steps:
      - id: start
        type: start
        next: ask_bus_from

      - id: ask_bus_from
        type: collect
        slot_name: bus_from
        response:
          text: "请问从哪个城市出发？"
        next: ask_bus_to

      - id: ask_bus_to
        type: collect
        slot_name: bus_to
        response:
          text: "请问到达哪个城市？"
        next: ask_bus_date

      - id: ask_bus_date
        type: collect
        slot_name: bus_date
        response:
          text: "请问几号出发？（格式 YYYY-MM-DD，例如 2026-09-01）"
        next: search_buses

      - id: search_buses
        type: action
        action: action_search_buses
        next: show_buses

      - id: show_buses
        type: action
        action: action_response
        args:
          text: "{{ slots.bus_results }}"
        next: end

      - id: end
        type: end
        next: [ ]

  transfer_search:
    name: 接送服务查询
    description: 帮用户查询接送服务（接机、送机、包车等），需要收集城市和服务日期。当用户询问"接送""接机""包车"时使用。
    steps:
      - id: start
        type: start
        next: ask_transfer_city

      - id: ask_transfer_city
        type: collect
        slot_name: transfer_city
        response:
          text: "请问在哪个城市使用接送服务？"
        next: ask_transfer_date

      - id: ask_transfer_date
        type: collect
        slot_name: transfer_date
        response:
          text: "请问哪天需要？（格式 YYYY-MM-DD，例如 2026-09-01）"
        next: search_transfers

      - id: search_transfers
        type: action
        action: action_search_transfers
        next: show_transfers

      - id: show_transfers
        type: action
        action: action_response
        args:
          text: "{{ slots.transfer_results }}"
        next: end

      - id: end
        type: end
        next: [ ]

  travel_order_query:
    name: 旅游订单查询
    description: 帮用户查询旅游平台订单的状态和出行信息，需要收集订单号。当用户询问"查订单""订单状态""我的订单"时使用。
    steps:
      - id: start
        type: start
        next: ask_order_no

      - id: ask_order_no
        type: collect
        slot_name: travel_order_no
        response:
          text: "请告诉我你的旅游订单号（例如 ORD0000000001）。"
        next: lookup_order

      - id: lookup_order
        type: action
        action: action_lookup_travel_order
        next: show_order

      - id: show_order
        type: action
        action: action_response
        args:
          text: "{{ slots.order_results }}"
        next: end

      - id: end
        type: end
        next: [ ]

  human_handoff:
    name: 人工客服
    description: 将当前对话转交给人工客服处理。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "好的，我来为你转接人工客服，请稍等。"
        next: end

      - id: end
        type: end
        next: [ ]
